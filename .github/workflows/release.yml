name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter 3.44.0 stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install NDK 28.2.13676358
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK (arm64)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Rename APK with version and architecture
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/AndroNet-${{ github.ref_name }}-arm64.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: AndroNet ${{ github.ref_name }}
          body: |
            ## AndroNet ${{ github.ref_name }}

            ### Installation
            1. Download AndroNet-${{ github.ref_name }}-arm64.apk
            2. On your Android device open the file
            3. Enable "Install from unknown sources" if prompted
            4. Install and open AndroNet

            ### Requirements
            - Android 8.0 or higher
            - For full packet capture: root or NetHunter
            - For VPN mode: no root required

            ### What's new
            See CHANGELOG.md for details
          files: build/app/outputs/flutter-apk/AndroNet-${{ github.ref_name }}-arm64.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
